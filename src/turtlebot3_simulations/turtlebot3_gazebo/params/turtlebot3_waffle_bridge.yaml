# Parameter Bridge for /our_bot
# Note: Global GZ /tf bridge removed so ROS 2 robot_state_publisher controls TF trees cleanly.
- ros_topic_name: "/tf"
  gz_topic_name: "/our_bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS


- ros_topic_name: "/our_bot/joint_states"
  gz_topic_name: "/our_bot/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/our_bot/odom"
  gz_topic_name: "/our_bot/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/our_bot/cmd_vel"
  gz_topic_name: "/our_bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/our_bot/scan"
  gz_topic_name: "/our_bot/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/our_bot/imu"
  gz_topic_name: "/our_bot/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS


