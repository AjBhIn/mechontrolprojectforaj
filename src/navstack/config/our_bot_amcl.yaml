# ==============================================================================
# AMCL Localization Configuration
# DIFFERENCE FROM STANDARD:
# 1. Root node block uses 'our_bot/amcl:' namespace.
# 2. odom_frame_id and base_frame_id use 'our_bot/' prefix.
# 3. Explicit absolute scan_topic ('/our_bot/scan') and map_topic ('/map').
# 4. set_initial_pose: true auto-seeds map -> our_bot/odom transform link.
# ==============================================================================
our_bot/amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: our_bot/base_link  # Prefixed base frame
    odom_frame_id: our_bot/odom            # Prefixed odom frame
    global_frame_id: map                   # Global map frame shared by all
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 8000
    min_particles: 200
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    map_topic: /map          # Shared global map
    scan_topic: /our_bot/scan # Namespaced scan topic
    set_initial_pose: true      # Automatically seeds map frame on bringup
    initial_pose:
      x: 1.0
      y: 2.0
      z: 0.0
      yaw: 0.0