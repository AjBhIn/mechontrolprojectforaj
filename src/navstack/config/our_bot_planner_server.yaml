our_bot:
  planner_server:
    ros__parameters:
      expected_planner_frequency: 10.0
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: our_bot/base_link
        use_sim_time: True
        resolution: 0.05
        track_unknown_space: true
        # footprint: '[ [0.15, 0.12], [0.15, -0.12], [-0.15, -0.12], [-0.15, 0.12] ]' # Matches global costmap footprint 
        robot_radius: 0.20
        plugins: ["static_layer", "obstacle_layer", "enemy_danger_layer", "inflation_layer"]

        # 2. Define the layer parameters
        enemy_danger_layer:
          plugin: "enemy_danger_layer/EnemyDangerLayer"
          enemy_frame: "enemy_bot/base_link"  # Set to exact TF frame of enemy base
          danger_radius: 0.5                # FOV radius in meters
          enabled: True

        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: /map
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /our_bot/scan  
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 5.0
          inflation_radius: 0.75
        always_send_full_costmap: True