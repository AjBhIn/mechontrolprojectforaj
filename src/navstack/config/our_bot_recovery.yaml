# ==============================================================================
# Behavior Server Configuration
# DIFFERENCE FROM STANDARD:
# 1. Root node scoped under 'our_bot/behavior_server'.
# 2. local_frame set to 'our_bot/odom' & robot_base_frame set to 'our_bot/base_footprint'.
# 3. enable_stamped_cmd_vel: false matches standard Twist command format.
# ==============================================================================
our_bot/behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true # Output standard geometry_msgs/TwistStamped
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: our_bot/odom                  # Prefixed local frame
    global_frame: map                          # Global map frame
    robot_base_frame: our_bot/base_link       # Prefixed base frame
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2